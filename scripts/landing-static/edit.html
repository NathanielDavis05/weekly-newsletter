<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit — Chick-fil-A West Bryan</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/images/cfa-logo.png" />
<style>
  :root {
    --red: #dd0031;
    --btn-top: #ff033b;
    --btn-bot: #ca0f1a;
    --navy: #004f71;
    --gray: #5b6770;
    --panel: #f5f7f8;
    --line: #e2e8eb;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--panel);
    color: #14212a;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 96px;
  }
  header.top {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header.top h1 { margin: 0; font-size: 18px; color: var(--navy); }
  header.top p { margin: 2px 0 0; font-size: 13px; color: var(--gray); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 20px; }

  #gate {
    max-width: 420px;
    margin: 60px auto;
    padding: 24px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  #gate h2 { margin-top: 0; font-size: 17px; color: var(--navy); }
  #gate p { color: var(--gray); font-size: 14px; }

  label { display: block; font-weight: 600; font-size: 13px; color: var(--navy); margin-bottom: 6px; }
  input[type="text"], input[type="url"], input[type="password"], textarea {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: 2px solid var(--red); outline-offset: 1px; }

  .field { margin-bottom: 16px; }
  .field .hint { font-size: 12px; color: var(--gray); margin-top: 4px; }

  section.group {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  section.group > h2 {
    margin: 0 0 14px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--red);
  }

  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(var(--btn-top), var(--btn-bot));
    color: #fff;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.secondary {
    background: none;
    color: var(--gray);
    font-weight: 600;
    padding: 6px 4px;
    text-decoration: underline;
  }

  #savebar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 5;
  }
  #savebar .btn { flex: 0 0 auto; }
  #status { font-size: 13px; color: var(--gray); flex: 1; }
  #status.error { color: var(--red); font-weight: 600; }
  #status.ok { color: #1b7f3a; font-weight: 600; }

  #app { display: none; }
  #loading { text-align: center; color: var(--gray); padding: 60px 20px; }
</style>
</head>
<body>

<header class="top">
  <h1>Edit the landing page</h1>
  <p>Changes here save to the live cfawestbryan.com page.</p>
</header>

<div id="gate">
  <h2>Enter the edit passcode</h2>
  <p>Ask whoever set this up if you don't have it.</p>
  <div class="field">
    <input type="password" id="passcode" placeholder="Passcode" autocomplete="off" />
  </div>
  <button class="btn" id="unlock">Unlock</button>
  <p id="gate-error" class="hint" style="color: var(--red);"></p>
</div>

<div id="loading" style="display:none">Loading current content…</div>

<div id="app">
  <div class="wrap" id="form-root"></div>
</div>

<div id="savebar" style="display:none">
  <span id="status"></span>
  <button class="btn secondary" id="relock">Lock</button>
  <button class="btn" id="save">Save</button>
</div>

<script>
(function () {
  var STORAGE_KEY = "cfa-edit-passcode";

  // path, label, input type ("text" | "textarea" | "url"), optional hint
  var SCHEMA = [
    { section: "Header", fields: [
      ["brand.name", "Brand name", "text"],
      ["brand.location", "Location", "text"],
    ]},
    { section: "Hero", fields: [
      ["hero.kicker", "Small line above the heading", "text"],
      ["hero.heading", "Main heading", "text"],
    ]},
    { section: "Quick links (3 buttons under the hero)", fields: [
      ["quickLinks.uniform", "Uniform orders — label", "text"],
      ["links.uniform", "Uniform orders — link", "url"],
      ["quickLinks.pathway", "Pathway — label", "text"],
      ["links.pathway", "Pathway — link", "url"],
      ["quickLinks.breakMeal", "Break meal policy — label", "text"],
      ["links.breakMeal", "Break meal policy — link", "url"],
    ]},
    { section: '"Find what you need" section', fields: [
      ["findSection.heading", "Heading", "text"],
      ["findSection.lead", "Subheading", "text"],
    ]},
    { section: "Newsletter card", fields: [
      ["cards.newsletter.heading", "Title", "text"],
      ["cards.newsletter.body", "Description", "textarea"],
      ["cards.newsletter.cta", "Button text", "text"],
      ["links.newsletter", "Link", "url"],
    ]},
    { section: "Training card", fields: [
      ["cards.training.heading", "Title", "text"],
      ["cards.training.body", "Description", "textarea"],
      ["cards.training.cta", "Button text", "text"],
      ["links.training", "Link", "url"],
    ]},
    { section: "Promotions card", fields: [
      ["cards.promotions.heading", "Title", "text"],
      ["cards.promotions.body", "Description", "textarea"],
      ["cards.promotions.cta", "Button text", "text"],
      ["links.promotions", "Link", "url"],
    ]},
    { section: "New team member section", fields: [
      ["newTeamMember.heading", "Heading", "text"],
      ["newTeamMember.lead", "Paragraph", "textarea"],
      ["newTeamMember.cta", "Button text", "text"],
      ["links.newTeamMember", "Link", "url", "Leave blank to keep the button disabled."],
    ]},
    { section: "Scorecard section", fields: [
      ["scorecardSection.heading", "Heading", "text"],
      ["scorecardSection.lead", "Paragraph", "textarea"],
      ["scorecardSection.cta", "Button text", "text"],
      ["links.scorecard", "Link", "url"],
    ]},
    { section: '"More for the team" tiles', fields: [
      ["moreGrid.timePunch.heading", "Time punch — title", "text"],
      ["moreGrid.timePunch.subheading", "Time punch — subtitle", "text"],
      ["links.timePunch", "Time punch — link", "url"],
      ["moreGrid.hrRequest.heading", "HR request — title", "text"],
      ["moreGrid.hrRequest.subheading", "HR request — subtitle", "text"],
      ["links.hrRequest", "HR request — link", "url"],
      ["moreGrid.restaurantInfo.heading", "Restaurant info — title", "text"],
      ["moreGrid.restaurantInfo.subheading", "Restaurant info — subtitle", "text"],
      ["links.restaurantInfo", "Restaurant info — link", "url"],
    ]},
    { section: "Footer", fields: [
      ["footer.name", "Footer name", "text"],
      ["footer.tagline", "Footer tagline", "text"],
    ]},
    { section: "Top menu labels", fields: [
      ["nav.newsletter", "Newsletter", "text"],
      ["nav.training", "Training", "text"],
      ["nav.promotions", "Promotions", "text"],
      ["nav.scorecard", "Scorecard", "text"],
      ["nav.restaurantInfo", "Restaurant info", "text"],
      ["nav.thisWeek", '"This week" pill', "text"],
    ]},
    { section: "Page title & description (browser tab / search)", fields: [
      ["meta.title", "Page title", "text"],
      ["meta.description", "Page description", "textarea"],
    ]},
  ];

  function getPath(obj, path) {
    return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function setPath(obj, path, value) {
    var keys = path.split(".");
    var last = keys.pop();
    var target = keys.reduce(function (o, k) { return o[k]; }, obj);
    target[last] = value;
  }

  var els = {
    gate: document.getElementById("gate"),
    gateError: document.getElementById("gate-error"),
    passcode: document.getElementById("passcode"),
    unlock: document.getElementById("unlock"),
    loading: document.getElementById("loading"),
    app: document.getElementById("app"),
    formRoot: document.getElementById("form-root"),
    savebar: document.getElementById("savebar"),
    status: document.getElementById("status"),
    save: document.getElementById("save"),
    relock: document.getElementById("relock"),
  };

  var content = null;
  var inputs = []; // {path, el}

  function setStatus(text, kind) {
    els.status.textContent = text || "";
    els.status.className = kind || "";
  }

  function renderForm(data) {
    els.formRoot.innerHTML = "";
    inputs = [];
    SCHEMA.forEach(function (group) {
      var section = document.createElement("section");
      section.className = "group";
      var h2 = document.createElement("h2");
      h2.textContent = group.section;
      section.appendChild(h2);

      group.fields.forEach(function (f) {
        var path = f[0], label = f[1], type = f[2], hint = f[3];
        var field = document.createElement("div");
        field.className = "field";

        var labelEl = document.createElement("label");
        labelEl.textContent = label;
        field.appendChild(labelEl);

        var input;
        if (type === "textarea") {
          input = document.createElement("textarea");
        } else {
          input = document.createElement("input");
          input.type = type === "url" ? "url" : "text";
        }
        input.value = getPath(data, path) || "";
        field.appendChild(input);

        if (hint) {
          var hintEl = document.createElement("p");
          hintEl.className = "hint";
          hintEl.textContent = hint;
          field.appendChild(hintEl);
        }

        section.appendChild(field);
        inputs.push({ path: path, el: input });
      });

      els.formRoot.appendChild(section);
    });
  }

  function collectFromForm() {
    var next = JSON.parse(JSON.stringify(content));
    inputs.forEach(function (i) { setPath(next, i.path, i.el.value); });
    return next;
  }

  function passcode() {
    return localStorage.getItem(STORAGE_KEY) || "";
  }

  function showApp() {
    els.gate.style.display = "none";
    els.loading.style.display = "block";
    fetch("/api/team-content")
      .then(function (r) {
        if (!r.ok) return r.json().then(function (b) { throw new Error(b.error || "Failed to load."); });
        return r.json();
      })
      .then(function (data) {
        content = data;
        renderForm(content);
        els.loading.style.display = "none";
        els.app.style.display = "block";
        els.savebar.style.display = "flex";
      })
      .catch(function (err) {
        els.loading.textContent = "Couldn't load content: " + err.message;
      });
  }

  els.unlock.addEventListener("click", function () {
    var code = els.passcode.value.trim();
    if (!code) return;
    localStorage.setItem(STORAGE_KEY, code);
    els.gateError.textContent = "";
    showApp();
  });
  els.passcode.addEventListener("keydown", function (e) {
    if (e.key === "Enter") els.unlock.click();
  });

  els.relock.addEventListener("click", function () {
    localStorage.removeItem(STORAGE_KEY);
    els.app.style.display = "none";
    els.savebar.style.display = "none";
    els.passcode.value = "";
    els.gate.style.display = "block";
  });

  els.save.addEventListener("click", function () {
    var body = collectFromForm();
    els.save.disabled = true;
    setStatus("Saving…");
    fetch("/api/team-content", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-edit-passcode": passcode(),
      },
      body: JSON.stringify(body),
    })
      .then(function (r) {
        return r.json().then(function (b) { return { ok: r.ok, body: b }; });
      })
      .then(function (res) {
        els.save.disabled = false;
        if (!res.ok) {
          setStatus(res.body.error || "Save failed.", "error");
          if (res.body.error === "Wrong passcode.") localStorage.removeItem(STORAGE_KEY);
          return;
        }
        content = body;
        setStatus("Saved. The live site will update in about a minute.", "ok");
      })
      .catch(function (err) {
        els.save.disabled = false;
        setStatus("Save failed: " + err.message, "error");
      });
  });

  if (passcode()) {
    els.gate.style.display = "none";
    showApp();
  }
})();
</script>
</body>
</html>
